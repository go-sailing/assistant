name: Build and Push Images

# 触发：master/main 分支推送、v* 标签、手动触发
on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 多架构：amd64（常规服务器）+ arm64（Apple Silicon / ARM VPS）；如只需单架构可删掉 arm64
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-push:
    name: build ${{ matrix.app }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 推送 ghcr.io 所需（使用内置 GITHUB_TOKEN，无需额外 secrets）
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: server
            context: src/server
          - app: web
            context: src/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR 要求镜像名全小写，仓库名可能含大写，这里统一转小写
      - name: Compute image prefix
        id: prefix
        run: echo "value=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 形如 ghcr.io/<owner>/<repo>/server 与 ghcr.io/<owner>/<repo>/web
          images: ${{ env.REGISTRY }}/${{ steps.prefix.outputs.value }}/${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 分层缓存复用，显著加快二次构建
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          provenance: false